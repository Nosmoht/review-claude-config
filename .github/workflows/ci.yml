name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check (matches Makefile `make lint`)
        run: ruff check hooks/ scripts/
      - name: Ruff format check (matches Makefile `make format`)
        run: ruff format --check hooks/ scripts/

  schema-validate:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -e .
      - name: Validate frontmatter and hooks.json
        run: python3 scripts/validate_schema.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=hooks --cov=scripts --cov-report=term-missing

  description-graph:
    name: Description-Graph Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with description-graph extra
        run: pip install -e ".[dev,description-graph]"
      - name: Run validate-descriptions
        run: make validate-descriptions
