name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check hooks/ scripts/
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check hooks/ scripts/

  schema-validate:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -e .
      - name: Validate frontmatter and hooks.json
        run: python3 scripts/validate_schema.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    if: hashFiles('tests/**/*.py') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=hooks --cov=scripts --cov-report=term-missing
