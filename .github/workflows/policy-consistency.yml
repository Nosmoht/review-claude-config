name: Policy Consistency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-merge-policy-drift:
    name: scoring-rubric.md ↔ merge-policy.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -e .
      - name: Verify merge-policy.yaml matches scoring-rubric.md
        run: python3 scripts/regenerate_merge_policy.py --check
