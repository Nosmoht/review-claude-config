name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry-run mode (logs only, no PR/tag/release created)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release-please bump + sync + validate + auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          dry-run: ${{ inputs.dry-run || false }}

      - name: Sync marketplace.json source.ref + plugins[0].version
        if: ${{ steps.release.outputs.pr != '' && !inputs.dry-run }}
        env:
          PR_HEAD: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
        run: |
          set -euo pipefail
          git fetch origin "$PR_HEAD"
          git checkout "$PR_HEAD"
          bash bin/sync-marketplace-ref.sh
          if ! git diff --quiet .claude-plugin/marketplace.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .claude-plugin/marketplace.json
            git commit -m "chore(release): sync marketplace.json source.ref"
            git push origin "$PR_HEAD"
          else
            echo "marketplace.json already in sync; nothing to commit."
          fi

      - name: Set up Python for validation
        if: ${{ steps.release.outputs.pr != '' && !inputs.dry-run }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate bot-PR branch (lint + format + schema + budget + tests + coverage)
        if: ${{ steps.release.outputs.pr != '' && !inputs.dry-run }}
        run: |
          set -euo pipefail
          pip install -e ".[dev]"
          make validate

      - name: Auto-merge release PR (only when validation passed)
        if: ${{ steps.release.outputs.pr != '' && !inputs.dry-run }}
        env:
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --repo "$GITHUB_REPOSITORY"

      - name: Refresh checkout to main after merge
        if: ${{ steps.release.outputs.pr != '' && !inputs.dry-run }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # GITHUB_TOKEN-driven merges do NOT cascade-trigger workflows. Without a
      # second release-please-action call inline, the tag + GitHub Release
      # would never be created. The action sees the just-merged release-PR
      # carrying label `autorelease: pending`, creates tag vX.Y.Z, publishes
      # the GitHub Release, and flips the label to `autorelease: tagged`.
      # Idempotent: a no-op if the tag already exists.
      - name: Tag + publish GitHub Release
        if: ${{ steps.release.outputs.pr != '' && !inputs.dry-run }}
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
