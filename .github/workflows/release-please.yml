name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry-run mode (logs only, no PR/tag/release created)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release-please bump + sync marketplace.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          dry-run: ${{ inputs.dry-run || false }}

      - name: Sync marketplace.json source.ref + plugins[0].version
        if: ${{ steps.release.outputs.pr != '' && !inputs.dry-run }}
        env:
          PR_HEAD: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          git fetch origin "$PR_HEAD"
          git checkout "$PR_HEAD"
          python3 scripts/sync-marketplace-ref.py
          if ! git diff --quiet .claude-plugin/marketplace.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .claude-plugin/marketplace.json
            git commit -m "chore(release): sync marketplace.json source.ref"
            git push origin "$PR_HEAD"
          else
            echo "marketplace.json already in sync; nothing to commit."
          fi
