[project]
name = "review-claude-config"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This repo is a Claude Code plugin + scripts collection, not a Python
# package. `pip install -e .` is used purely to materialize the runtime
# dependencies (pyyaml, jsonschema) into the venv used by CI and Makefile
# — there is no importable top-level package. Declaring empty package /
# py-modules lists tells setuptools to skip auto-discovery, which would
# otherwise reject the build because of the 5 top-level directories
# (Plans, agents, hooks, research, skills) that look like Python
# packages but are not.
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# Calibrated 2026-04-27 against actual repo coverage (88% total). Threshold
# at 85% leaves a 3-point margin so new lightly-tested code does not
# immediately break CI, while preventing silent regressions below the
# current floor. Bump deliberately as coverage on the lower modules
# (verify_hook_events, escalation_decision, audit_rotator) improves.
fail_under = 85
