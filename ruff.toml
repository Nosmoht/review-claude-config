# ruff.toml — minimal config for hook scripts
target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "W", "I"]

[lint.per-file-ignores]
# merge_findings.py uses PEP 562 module-level __getattr__ to lazy-load 5
# policy constants from merge-policy.yaml. Names are declared under
# `if TYPE_CHECKING:` for static analyzers, but ruff's F821 runs purely at
# lex-level and does not honor TYPE_CHECKING blocks. Suppress F821 only on
# this file so the lazy-load pattern stays clean.
"scripts/merge_findings.py" = ["F821"]
